<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lumio — podgląd ludzika</title>
  <link rel="stylesheet" href="css/app.css">
  <style>
    main { max-width: 56rem; margin: 1.5rem auto; padding: 0 1rem 3rem; }
    .row-dolls { display: flex; flex-wrap: wrap; gap: 1.25rem; }
    figure {
      margin: 0;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 0.85rem 1rem 1rem;
      text-align: center;
      min-width: 10rem;
    }
    figcaption { margin-top: 0.4rem; font-size: 0.88rem; color: var(--ink-soft); }
  </style>
</head>
<body>
  <main>
    <p class="label">Podgląd</p>
    <h1>Ludzik</h1>
    <p class="muted">To nie jest apka — tylko porównanie strojów i twarzy, zanim wejdzie na mapę.</p>
    <div class="row-dolls" id="row"></div>
  </main>
  <script type="module">
    import { renderAvatar } from './js/avatar.js';
    const look = { hairColor: 'brunette', eyeColor: 'brown' };
    const looks = [
      ['codzienny', { hair: 'hair-bob', top: 'top-tshirt', bottom: 'bottom-shorts' }],
      ['szminka', { hair: 'hair-bob', top: 'top-tshirt', bottom: 'bottom-shorts', lips: 'lipstick' }],
      [
        'jak na zdjęciu',
        { hair: 'hair-bob', top: 'top-tshirt', bottom: 'bottom-shorts', lips: 'lipstick', head: 'bow' },
        { hairColor: 'blonde', eyeColor: 'blue' },
      ],
      ['Londyn — błękitna', { hair: 'hair-long', top: 'top-navy', bottom: 'bottom-navy' }],
      ['różowa / Londyn', { hair: 'hair-ponytail', top: 'top-red', bottom: 'bottom-red', lips: 'lipstick' }],
      ['Berlin — ołówkowa', { hair: 'hair-bob', top: 'top-lilac', bottom: 'bottom-lilac', head: 'beanie' }],
      ['Paryż — mała czarna', { hair: 'hair-long', top: 'top-sun', bottom: 'bottom-sun', neck: 'necklace' }],
      ['Dublin — sweter', { hair: 'hair-ponytail', top: 'top-denim', bottom: 'bottom-jeans' }],
      ['spinki', { hair: 'hair-bob', top: 'top-tshirt', bottom: 'bottom-shorts', head: 'clips', ears: 'studs' }],
      ['Amsterdam — paski + beret', { hair: 'hair-long', top: 'top-mint', bottom: 'bottom-mint', head: 'beret' }],
      ['Barcelona — grochy', { hair: 'hair-ponytail', top: 'top-coral', bottom: 'bottom-coral', neck: 'choker', lips: 'gloss' }],
      ['Edynburg — płaszcz i krata', { hair: 'hair-bob', top: 'top-coat', bottom: 'bottom-skirt' }],
      ['mix: trencz + jeansy', { hair: 'hair-bob', top: 'top-navy', bottom: 'bottom-jeans' }],
      ['mix: sweter + krata', { hair: 'hair-ponytail', top: 'top-denim', bottom: 'bottom-skirt' }],
      ['balowa + tiara', { hair: 'hair-long', top: 'top-ball', bottom: 'bottom-ball', head: 'tiara', neck: 'pearls', lips: 'lipstick' }],
      ['kwiatek i koła', { hair: 'hair-ponytail', top: 'top-tshirt', bottom: 'bottom-shorts', head: 'flower', ears: 'hoops' }],
    ];
    const row = document.getElementById('row');
    for (const [name, eq, lookOverride] of looks) {
      const f = document.createElement('figure');
      f.innerHTML =
        renderAvatar(eq, { size: 220, look: lookOverride || look }) + `<figcaption>${name}</figcaption>`;
      row.appendChild(f);
    }
  </script>
</body>
</html>
